name: Validate Mongo config readability
on:
  push:
    branches: [validation/tag-install-update-455]
    paths: [.github/workflows/nov03-mongo.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dbfixtures/pytest-mongo
          ref: 587fc82787f43ff585909ba75b27dd15de414dd8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . ruff build
      - name: Install candidate
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          files = {"pytest_mongo/config.py":"","tests/test_config_precedence.py":"","newsfragments/952.misc.rst":"UmVzb2x2ZSB0aGUgVExTIGFuZCB0aW1lem9uZS1hd2FyZSBzZXR0aW5ncyBiZWZvcmUgY29uc3RydWN0aW5nIE1vbmdvQ29uZmlnIGZvciByZWFkYWJpbGl0eS4K"}
          for name,content in files.items():
              p=Path(name)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(base64.b64decode(content))
          
          PY
          ruff format pytest_mongo/config.py tests/test_config_precedence.py
          ruff check pytest_mongo/config.py tests/test_config_precedence.py
      - name: Test CLI and ini precedence without mongod
        run: |
          python -m pytest -o addopts= -q tests/test_tz_aware.py tests/test_config_precedence.py --junitxml=precedence.xml
          python -m build
          git diff --check
          sha256sum pytest_mongo/config.py tests/test_config_precedence.py newsfragments/952.misc.rst
      - uses: actions/upload-artifact@v4
        with:
          name: mongo-config-tested
          path: |
            pytest_mongo/config.py
            tests/test_config_precedence.py
            newsfragments/952.misc.rst
            precedence.xml
