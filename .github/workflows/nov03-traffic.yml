name: Validate traffic light recipe
on:
  push:
    branches: [validation/tag-install-update-455]
    paths: [.github/workflows/nov03-traffic.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: laaielichter/Godotwright
          ref: 2f778c291b97e82fcd5f5518c09fde57f06cfd1e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install candidate
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          files = {"data/recipes/traffic-light.json":"","test/build/traffic-light.test.ts":""}
          for name,content in files.items():
              p=Path(name); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(base64.b64decode(content))
          
          PY
      - name: Full project checks
        run: |
          npm run typecheck
          npm test -- --reporter=json --outputFile=traffic-tests.json
          npm run build
          git diff --check
      - name: Real CLI build lint and text view
        env:
          NO_COLOR: '1'
        run: |
          node dist/cli.js model build traffic-light -o traffic-light.glb
          node dist/cli.js model lint traffic-light.glb --archetype infrastructure.traffic-light
          node dist/cli.js model view traffic-light.glb > traffic-view.txt
          sha256sum data/recipes/traffic-light.json test/build/traffic-light.test.ts
      - name: Render the actual GLB for visual review
        run: |
          npm install --prefix "$RUNNER_TEMP/render" playwright three
          cd "$RUNNER_TEMP/render"
          npx playwright install --with-deps chromium
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('index.html').write_bytes(base64.b64decode(''))
          Path('render.mjs').write_bytes(base64.b64decode(''))
          PY
          cp "$GITHUB_WORKSPACE/traffic-light.glb" .
          python -m http.server 8765 --bind 127.0.0.1 > server.log 2>&1 &
          RENDER_OUT="$GITHUB_WORKSPACE/traffic-light.png" node render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: traffic-light-tested
          path: |
            data/recipes/traffic-light.json
            test/build/traffic-light.test.ts
            traffic-light.glb
            traffic-light.png
            traffic-view.txt
            traffic-tests.json
