name: Diagnose furniture aliases
on:
  push:
    branches: [validation/tag-install-update-455]
    paths: [.github/workflows/nov03-furniture-diagnose.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: laaielichter/Godotwright
          ref: 2f778c291b97e82fcd5f5518c09fde57f06cfd1e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install candidate
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          files = {"data/archetypes/prop.json":"","data/archetypes/infrastructure.json":"","src/archetype/library.ts":"","test/archetype/archetype.test.ts":""}
          for name,content in files.items():
              Path(name).write_bytes(base64.b64decode(content))
          
          PY
      - name: Full project checks
        run: |
          npm run typecheck
          npm test -- test/archetype/archetype.test.ts --reporter=verbose
          npm run build
          git diff --check
          sha256sum data/archetypes/prop.json data/archetypes/infrastructure.json src/archetype/library.ts test/archetype/archetype.test.ts
      - name: Real CLI identification
        run: |
          node dist/cli.js model identify "bed"
          node dist/cli.js model identify "boekenkast"
          node dist/cli.js model identify "bushalte"
          node dist/cli.js model identify "bank"
      - uses: actions/upload-artifact@v4
        with:
          name: furniture-tested
          path: |
            furniture-tests.json
            data/archetypes/prop.json
            data/archetypes/infrastructure.json
            src/archetype/library.ts
            test/archetype/archetype.test.ts
