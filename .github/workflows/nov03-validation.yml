name: Validate Soup halt guards
on:
  push:
    branches: [validation/tag-install-update-455]
    paths: [.github/workflows/nov03-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ANO3457/Soup
          ref: 811314a2fbaee95813e568923294ff2e18463584
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-timeout ruff httpx jsonschema cryptography
      - name: Install candidate tests
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('tests/test_generate_count.py').write_bytes(base64.b64decode(''))
          PY
          ruff check --select I --fix tests/test_generate_count.py
          ruff format tests/test_generate_count.py
          ruff check tests/test_generate_count.py
      - name: Verify halt tests
        run: python -m pytest tests/test_generate_count.py -o addopts= -q --junitxml=halt.xml
      - name: Prove each save guard matters
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('src/soup_cli/commands/generate.py')
          original=p.read_text()
          start=original.index('if consecutive_empty >= max_empty_retries:')
          cases=[('if all_examples:', 'if True:', 'test_generate_halt_without_rows_preserves_output'), ('if _path_within_cwd(partial_path, cwd):', 'if True:', 'test_generate_halt_does_not_save_through_escaped_symlink')]
          try:
              for before,after,test in cases:
                  suffix=original[start:]
                  assert before in suffix
                  p.write_text(original[:start]+suffix.replace(before,after,1))
                  result=subprocess.run(['python','-m','pytest','tests/test_generate_count.py','-o','addopts=','-q','-k',test],capture_output=True,text=True)
                  print(result.stdout)
                  assert result.returncode==1, result.stderr
          finally:
              p.write_text(original)
          PY
          git diff --check
          sha256sum tests/test_generate_count.py
      - uses: actions/upload-artifact@v4
        with:
          name: soup-halt-tested
          path: |
            tests/test_generate_count.py
            halt.xml
